name: fquiz 镜像构建与部署

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: fquiz-build-and-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ck-registry' }}

jobs:
  # ───── 一级基础镜像（python + 系统库 + pip 依赖，无 wine、无业务代码） ─────
  build-base:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-base" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 base 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.base
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            PIP_INDEX_URL=${{ secrets.PIP_INDEX_URL || vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
            PIP_DEFAULT_TIMEOUT=${{ vars.PIP_DEFAULT_TIMEOUT || '120' }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-base
          cache-to: type=gha,mode=max,scope=fquiz-base

  # ───── 二级 wine-base 镜像（base + wine，仅 amd64，api/worker 共用） ─────
  build-wine-base:
    needs: [build-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-wine-base" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 wine-base 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.winebase
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-wine-base
          cache-to: type=gha,mode=max,scope=fquiz-wine-base

  # ───── 二级 wine-base-64 镜像（base + 64位 wine，专供 MATLAB 判别系统） ─────
  build-wine-base-64:
    needs: [build-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-wine-base-64" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 wine-base-64 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.winebase64
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-wine-base-64
          cache-to: type=gha,mode=max,scope=fquiz-wine-base-64

  # ───── Worker 镜像（wine-base + 业务代码，celery worker） ─────
  build-worker:
    needs: [build-wine-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-worker" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 Worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-worker
          cache-to: type=gha,mode=max,scope=fquiz-worker

  # ───── MATLAB Worker 镜像（wine-base-64 + Windows MATLAB Runtime + 判别系统） ─────
  # 消费 matlab-diagnostics 队列，判别任务专用；Runtime 先走官方源，失败回退到 84。
  build-matlab-worker:
    needs: [build-wine-base-64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-matlab-worker" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 MATLAB Worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.matlab
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-matlab-worker
          cache-to: type=gha,mode=max,scope=fquiz-matlab-worker

  # ───── API 镜像（无 wine，仅 amd64） ─────
  build-api:
    needs: [build-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-api" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 API 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            PIP_INDEX_URL=${{ secrets.PIP_INDEX_URL || vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
            PIP_DEFAULT_TIMEOUT=${{ vars.PIP_DEFAULT_TIMEOUT || '120' }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-api
          cache-to: type=gha,mode=max,scope=fquiz-api

  # ───── Web 镜像（仅 amd64） ─────
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://127.0.0.1:8000' }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ vars.NEXT_PUBLIC_APP_BASE_PATH || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-web
          cache-to: type=gha,mode=max,scope=fquiz-web

  # ───── ctb-worker 镜像（仅 amd64） ─────
  build-ctb-worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/ctb-worker" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 ctb-worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./services/ctb-worker
          file: ./services/ctb-worker/Dockerfile.worker
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=ctb-worker
          cache-to: type=gha,mode=max,scope=ctb-worker

  # ───── 部署到生产服务器 ─────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-api, build-worker, build-web, build-ctb-worker, build-matlab-worker]
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: 校验部署参数
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${SERVER_HOST}" ] || { echo "::error::缺少 SERVER_HOST（请在 Secrets 或 Variables 中配置）"; exit 1; }
          [ -n "${SERVER_USER}" ] || { echo "::error::缺少 SERVER_USER（请在 Secrets 或 Variables 中配置）"; exit 1; }
          if [ -z "${SERVER_SSH_KEY}" ] && [ -z "${SERVER_PASSWORD}" ]; then
            echo "::error::缺少登录凭据：请至少配置 SERVER_SSH_KEY 或 SERVER_PASSWORD"
            exit 1
          fi
          [ -n "${REGISTRY_USERNAME}" ] || { echo "::error::缺少 REGISTRY_USERNAME"; exit 1; }
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::缺少 REGISTRY_PASSWORD"; exit 1; }

      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 准备远端部署目录
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 10m
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/lp}"
            mkdir -p "${DEPLOY_DIR}"
            # 备份真实的生产环境变量（SCP 会从仓库覆盖它）
            if [ -f "${DEPLOY_DIR}/deploy/pro-deploy/.env.prod" ]; then
              cp "${DEPLOY_DIR}/deploy/pro-deploy/.env.prod" "/tmp/lp_env_prod_backup"
              echo "已备份 .env.prod"
            fi

      - name: 同步 deploy/pro-deploy 配置到服务器
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120s
          command_timeout: 10m
          source: "deploy/pro-deploy"
          target: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/lp' }}
          overwrite: true

      - name: 通过 SSH 拉取并更新容器
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://127.0.0.1:8000' }}
          FLOWER_BASIC_AUTH: ${{ secrets.FLOWER_BASIC_AUTH || vars.FLOWER_BASIC_AUTH || 'admin:admin' }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ env.REGISTRY_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 45m
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DEPLOY_PATH,IMAGE_TAG,NEXT_PUBLIC_API_BASE_URL,FLOWER_BASIC_AUTH,REGISTRY,REGISTRY_NAMESPACE,REGISTRY_USERNAME,REGISTRY_PASSWORD,CTB_WORKER_IMAGE
          script: |
            set -euo pipefail
            export DOCKER_CLIENT_TIMEOUT="${DOCKER_CLIENT_TIMEOUT:-600}"
            export COMPOSE_HTTP_TIMEOUT="${COMPOSE_HTTP_TIMEOUT:-600}"

            DEPLOY_DIR="${DEPLOY_PATH:-/opt/lp}"
            cd "${DEPLOY_DIR}"

            # 恢复真实的生产环境变量
            if [ -f "/tmp/lp_env_prod_backup" ]; then
              cp "/tmp/lp_env_prod_backup" deploy/pro-deploy/.env.prod
              echo "已恢复 .env.prod 备份"
            fi

            [ -f deploy/pro-deploy/compose.yml ] || { echo "[error] deploy/pro-deploy/compose.yml 不存在"; exit 1; }
            [ -f deploy/pro-deploy/.env ] || { echo "[error] deploy/pro-deploy/.env 不存在"; exit 1; }
            [ -f deploy/pro-deploy/.env.prod ] || { echo "[error] deploy/pro-deploy/.env.prod 不存在"; exit 1; }

            mkdir -p \
              deploy/pro-deploy/data/postgres \
              deploy/pro-deploy/data/redis \
              deploy/pro-deploy/data/minio \
              deploy/pro-deploy/data/app/celery

            # 直接构造镜像名称（当前构建 job 无 outputs，用 env 变量拼接）
            API_IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/fquiz-api"
            WEB_IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/fquiz-web"
            CTB_WORKER_IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/ctb-worker"
            WORKER_IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/fquiz-worker"
            MATLAB_WORKER_IMAGE="${REGISTRY}/${REGISTRY_NAMESPACE}/fquiz-matlab-worker"
            {
              echo "API_IMAGE=${API_IMAGE}:${IMAGE_TAG}"
              echo "WEB_IMAGE=${WEB_IMAGE}:${IMAGE_TAG}"
              echo "CTB_WORKER_IMAGE=${CTB_WORKER_IMAGE}:${IMAGE_TAG}"
              echo "WORKER_IMAGE=${WORKER_IMAGE}:${IMAGE_TAG}"
              echo "MATLAB_WORKER_IMAGE=${MATLAB_WORKER_IMAGE}:${IMAGE_TAG}"
              echo "NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}"
              echo "NEXT_PUBLIC_APP_BASE_PATH="
              echo "FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH}"
            } > .images.env

            echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

            COMPOSE_CMD="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            fi

            COMPOSE_PROJECT_NAME="$(awk -F= '/^COMPOSE_PROJECT_NAME=/{print $2; exit}' deploy/pro-deploy/.env | tr -d '[:space:]')"
            COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:-fquiz}"

            compose_run() {
              ${COMPOSE_CMD} -p "${COMPOSE_PROJECT_NAME}" --env-file deploy/pro-deploy/.env --env-file deploy/pro-deploy/.env.prod --env-file .images.env -f deploy/pro-deploy/compose.yml "$@"
            }

            pull_with_retry() {
              local max_retries=3
              local attempt=1
              while true; do
                if compose_run pull; then
                  break
                fi
                if [ "${attempt}" -ge "${max_retries}" ]; then
                  echo "[error] docker compose pull failed after ${max_retries} attempts."
                  return 1
                fi
                local sleep_seconds=$((attempt * 20))
                echo "[warn] docker compose pull failed (attempt ${attempt}/${max_retries}), retrying in ${sleep_seconds}s..."
                sleep "${sleep_seconds}"
                attempt=$((attempt + 1))
              done
            }

            # ── 方案 A：在部署机下载并幂等解压 MATLAB Runtime（外部持久卷） ──
            # 镜像不携带 MCR（避免 runner 磁盘溢出）。zip 由部署机直连官方源下载（失败回退 84 nginx），
            # 解压到 deploy/pro-deploy/data/matlab-worker/mcr（容器挂载 /opt/mcr-stage）。
            # .unpacked 标记：仅首次（或无标记时）下载+解压，重复发布/重新拉取镜像跳过。
            MW_DIR="${DEPLOY_DIR}/deploy/pro-deploy/data/matlab-worker"
            MCR_DIR="${MW_DIR}/mcr"
            MCR_ZIP_PATH="${MCR_DIR}/mcr.zip"
            UNPACKED_MARKER="${MCR_DIR}/.unpacked"
            MCR_OFFICIAL_URL="${MCR_OFFICIAL_URL:-https://ssd.mathworks.cn/supportfiles/downloads/R2026a/Release/0/deployment_files/installer/complete/win64/MATLAB_Runtime_R2026a_win64.zip}"
            DL_BASE="${DL_BASE:-http://223.109.142.84/downloads}"
            mkdir -p "${MCR_DIR}" "${MW_DIR}/matlab-wave" "${MW_DIR}/wine"
            
            if [ -f "${UNPACKED_MARKER}" ]; then
              echo "MCR 已在部署机下载并解压过（.unpacked 存在），跳过"
            else
              # 1) 下载 mcr.zip（存在则跳过；官方源优先，失败回退 84）
              if [ ! -f "${MCR_ZIP_PATH}" ]; then
                echo "下载 MCR zip（官方源优先）: ${MCR_OFFICIAL_URL}"
                curl -fSL --retry 3 --retry-delay 5 -o "${MCR_ZIP_PATH}" "${MCR_OFFICIAL_URL}" \
                  || { echo "官方源失败，回退 84: ${DL_BASE}"; curl -fSL --retry 5 --retry-delay 5 -o "${MCR_ZIP_PATH}" "${DL_BASE}/MATLAB_Runtime_R2026a_win64.zip"; }
                ls -lh "${MCR_ZIP_PATH}"
              else
                echo "mcr.zip 已存在于部署机，跳过下载"
              fi
            
              # 2) 幂等解压到 MCR_DIR（对齐容器挂载 /opt/mcr-stage）
              echo "解压 MCR zip 到 ${MCR_DIR} ..."
              ( cd "${MCR_DIR}" && unzip -q -o mcr.zip ) || { echo "[error] MCR 解压失败"; exit 1; }
              touch "${UNPACKED_MARKER}"
              echo "MCR 下载并解压完成，写入标记"
            fi

            pull_with_retry

            if ! compose_run up -d --remove-orphans; then
              echo "[error] docker compose up failed, collecting container diagnostics..."
              compose_run ps || true
              compose_run logs --no-color --tail 300 api || true
              compose_run logs --no-color --tail 200 db || true
              compose_run logs --no-color --tail 200 redis || true
              compose_run logs --no-color --tail 200 celery-worker || true
              compose_run logs --no-color --tail 200 celery-beat || true
              compose_run logs --no-color --tail 200 ctb-worker || true
              compose_run logs --no-color --tail 200 flower || true
              exit 1
            fi

            compose_run ps

      - name: 重启 nginx 清 DNS 缓存
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30s
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DEPLOY_PATH
          script: |
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/lp}"
            cd "${DEPLOY_DIR}"
            docker compose -p "$(awk -F= '/^COMPOSE_PROJECT_NAME=/{print $2; exit}' deploy/pro-deploy/.env | tr -d '[:space:]')" -f deploy/pro-deploy/compose.yml restart proxy
