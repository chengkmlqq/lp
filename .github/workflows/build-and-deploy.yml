name: fquiz 镜像构建与部署

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: fquiz-build-and-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ck-registry' }}

jobs:
  # ───── 一级基础镜像（python + 系统库 + pip 依赖，无 wine、无业务代码） ─────
  build-base:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-base" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 base 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.base
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            PIP_INDEX_URL=${{ secrets.PIP_INDEX_URL || vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
            PIP_DEFAULT_TIMEOUT=${{ vars.PIP_DEFAULT_TIMEOUT || '120' }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-base
          cache-to: type=gha,mode=max,scope=fquiz-base

  # ───── 二级 wine-base 镜像（base + wine，仅 amd64，api/worker 共用） ─────
  build-wine-base:
    needs: [build-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-wine-base" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 wine-base 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.winebase
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-wine-base
          cache-to: type=gha,mode=max,scope=fquiz-wine-base

  # ───── Worker 镜像（wine-base + 业务代码，celery worker） ─────
  build-worker:
    needs: [build-wine-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-worker" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 Worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.worker
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-worker
          cache-to: type=gha,mode=max,scope=fquiz-worker

  # ───── MATLAB Worker 镜像（fquiz-mcr-base + 判别系统，Linux 原生） ─────
  # MATLAB Runtime 基础镜像 fquiz-mcr-base 基本不变；matlab-worker 镜像仅在
  # Dockerfile.matlab 或 api/services/ 中判别相关代码变更时重新构建，否则
  # 沿用上次构建的 tag，避免每次部署拉取 17.6GB 全量镜像。
  build-matlab-worker:
    needs: [build-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 检查是否需构建（仅 Dockerfile.matlab 或判别相关代码变更时）
        id: check
        shell: bash
        run: |
          if git diff --quiet HEAD~1 HEAD -- api/Dockerfile.matlab api/app/services/fault_diagnosis*.py api/app/services/fl_analysis*.py api/app/tasks/sync_matlab_engine_task.py; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 清理 runner 磁盘（Linux MCR 构建峰值 ~25G，需先释放预装工具空间）
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-matlab-worker" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 MCR 基础镜像（fquiz-base + Linux MATLAB Runtime）
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.mcrbase
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
            MCR_VERSION=${{ vars.MATLAB_MCR_VERSION || 'R2023a' }}
            MCR_DOWNLOAD_URL=${{ vars.MATLAB_MCR_URL || 'https://ssd.mathworks.com/supportfiles/downloads/R2023a/Release/0/deployment_files/installer/complete/glnxa64/MATLAB_Runtime_R2023a_glnxa64.zip' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fquiz-mcr-base:r2023a
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fquiz-mcr-base:latest
          cache-from: type=gha,scope=fquiz-mcr-base
          cache-to: type=gha,mode=max,scope=fquiz-mcr-base

      - name: 构建并推送 MATLAB Worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile.matlab
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fquiz-mcr-base:r2023a
            type=gha,scope=fquiz-matlab-worker
          cache-to: type=gha,mode=max,scope=fquiz-matlab-worker

  # ───── API 镜像（无 wine，仅 amd64） ─────
  build-api:
    needs: [build-base]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-api" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 API 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            REGISTRY=${{ env.REGISTRY }}
            REGISTRY_NAMESPACE=${{ env.REGISTRY_NAMESPACE }}
            PIP_INDEX_URL=${{ secrets.PIP_INDEX_URL || vars.PIP_INDEX_URL || 'https://pypi.org/simple' }}
            PIP_DEFAULT_TIMEOUT=${{ vars.PIP_DEFAULT_TIMEOUT || '120' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-api
          cache-to: type=gha,mode=max,scope=fquiz-api

  # ───── Web 镜像（仅 amd64） ─────
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/fquiz-web" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 Web 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          build-args: |
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || 'https://registry.npmjs.org' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || '' }}
            NEXT_PUBLIC_APP_BASE_PATH=${{ vars.NEXT_PUBLIC_APP_BASE_PATH || '' }}
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=fquiz-web
          cache-to: type=gha,mode=max,scope=fquiz-web

  # ───── ctb-worker 镜像（仅 amd64） ─────
  build-ctb-worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: 生成镜像变量
        id: vars
        shell: bash
        run: |
          NS="${{ env.REGISTRY_NAMESPACE }}"
          echo "image=${{ env.REGISTRY }}/${NS}/ctb-worker" >> "$GITHUB_OUTPUT"

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 ctb-worker 镜像
        uses: docker/build-push-action@v7
        with:
          context: ./services/ctb-worker
          file: ./services/ctb-worker/Dockerfile.worker
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha,scope=ctb-worker
          cache-to: type=gha,mode=max,scope=ctb-worker

  # ───── 部署到生产服务器 ─────
