x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - ""
      - --stop-writes-on-bgsave-error
      - "no"
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE}
    depends_on:
      - minio
    entrypoint: /bin/sh
    command:
      - -c
      - >
        until mc alias set local "$${MINIO_ENDPOINT}" "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"; do
          sleep 1;
        done;
        mc mb -p "local/$${MINIO_BUCKET}" || true;
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    restart: "no"

  api:
    image: ${API_IMAGE}
    depends_on:
      - db
      - redis
      - minio
      - minio-init
    env_file:
      - ./.env.prod
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: db
      DB_PORT: 5432
      MINIO_ENDPOINT: http://minio:9000
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./data/app:/app/data
      - ./data/terrain:/app/data/terrain
    restart: unless-stopped
    logging: *default-logging

  celery-worker:
    image: ${API_IMAGE}
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - worker
      - --loglevel=${CELERY_LOG_LEVEL}
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      - api
      - redis
    env_file:
      - ./.env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./data/app:/app/data
    restart: unless-stopped
    logging: *default-logging

  ctb-worker:
    image: ${CTB_WORKER_IMAGE}
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      TERRAIN_ROOT: /data/terrain
    volumes:
      - ./data/terrain:/data/terrain
    restart: unless-stopped
    logging: *default-logging

  celery-beat:
    image: ${API_IMAGE}
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - beat
      - --loglevel=${CELERY_LOG_LEVEL}
      - --schedule=/app/data/celery/beat-schedule
    depends_on:
      - api
      - redis
    env_file:
      - ./.env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ./data/app:/app/data
    restart: unless-stopped
    logging: *default-logging

  flower:
    image: ${API_IMAGE}
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
      - flower
      - --address=0.0.0.0
      - --port=5555
      - --persistent=False
      - --basic-auth=${FLOWER_BASIC_AUTH}
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_TIMEZONE: ${CELERY_TIMEZONE}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:change_me}
    ports:
      - "127.0.0.1:${FLOWER_PORT}:5555"
    restart: unless-stopped
    logging: *default-logging

  web:
    image: ${WEB_IMAGE}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_APP_BASE_PATH: ${NEXT_PUBLIC_APP_BASE_PATH}
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped
    logging: *default-logging

  proxy:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    depends_on:
      - web
      - api
    ports:
      - "3001:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging: *default-logging
