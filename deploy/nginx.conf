server {
  listen 3000;
  server_name _;

  # 高程 DEM 等大文件上传：GB 级体积，且不能让 nginx 先缓冲整份请求体
  client_max_body_size 2g;
  client_body_timeout 3600s;
  client_body_buffer_size 1m;

  # Docker DNS — 动态解析容器名，避免容器重建后 502
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /terrain/ {
    alias /data/app/terrain/;
    add_header Access-Control-Allow-Origin *;
    expires -1;
    types { }
    default_type application/octet-stream;
  }

  location /api/v1/ws {
    set $api_backend "http://api:8000";
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    set $api_backend "http://api:8000";
    proxy_pass $api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 边收边转：不把 GB 级请求体先落到 nginx 临时目录再转发
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    set $web_backend "http://web:3000";
    proxy_pass $web_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
