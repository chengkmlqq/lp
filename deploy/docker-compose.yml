      CELERY_RESULT_BACKEND: redis://:Cp990803@redis:6379/1
      CELERY_TIMEZONE: Asia/Shanghai
      FLOWER_BASIC_AUTH: admin:admin
    ports:
      - "5555:5555"
    restart: unless-stopped
    
  ctb-worker:
