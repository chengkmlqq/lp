  flower:
    image: crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com/ck-registry/fquiz-api:latest
    container_name: lp-flower
    entrypoint: [""]
    command:
      - celery
      - -A
      - app.core.celery_app.celery_app
