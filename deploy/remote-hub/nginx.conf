# lp-remote-hub：把 lp_lpnet 内的 PostgreSQL / Redis 代理到容器自身的 15432 / 16379。
# 用 nginx stream（官方 alpine 镜像是 --with-stream 静态编译，无需额外装模块）。
#
# 关键点：proxy_pass 用变量 + resolver 127.0.0.11，让 nginx 按连接实时解析
# 容器名——否则上游容器重启换 IP 后 nginx 还咬着旧 IP 不放，隧道会静默连不上。

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    server {
        listen 15432;
        set $pg_upstream "lp-pg:5432";
        proxy_pass $pg_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 2h;
    }

    server {
        listen 16379;
        set $redis_upstream "lp-redis:6379";
        proxy_pass $redis_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 2h;
    }
}
